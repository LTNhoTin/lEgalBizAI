# =======================================================
# LEGALBIZAI — Embedding Fine-tuning Configuration
# =======================================================

# -------------------------------
# Cấu hình chung
# -------------------------------
general:
  # Dữ liệu huấn luyện
  data_path: "/home/nhotin/work/LegalBizAI_project/finetune/data_finetunning/qaset_full_article.json"
  test_split: 0.2

  # Logging (Weights & Biases)
  use_wandb: true
  wandb_project: "legal-embedding-models"
  wandb_entity: "nhotin911"

  # Phần cứng & độ chính xác
  device: "auto"          # "cuda" hoặc "cpu"
  use_fp16: true
  use_bf16: false

  # Đánh giá mô hình
  k_values: [1, 3, 5, 10]

  # Ngẫu nhiên hóa (reproducibility)
  seed: 42


# -------------------------------
# Cấu hình cho từng model embedding
# -------------------------------
models:

  # =====================================================
  # 1 GEMMA Embedding Model 
  # =====================================================
  gemma:
    enabled: false  
    model_name: "google/embeddinggemma-300m"
    max_seq_length: 512  # EmbeddingGemma supports up to 2K tokens, using 512 for efficiency
    embedding_dim: 768   # EmbeddingGemma default dimension (supports 768, 512, 256, 128 via Matryoshka)

    # LoRA settings
    use_lora: true
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

    ## Training settings
    batch_size: 2
    num_epochs: 30  
    learning_rate: 0.00001
    weight_decay: 0.01
    warmup_ratio: 0.1
    gradient_accumulation_steps: 4
    max_grad_norm: 1.0
    dataloader_num_workers: 2
    
    # Precision settings (override general config for better stability)
    use_fp16: false
    use_bf16: true  # Better stability than fp16 on modern GPUs

    # Contrastive learning
    num_negatives: 8
    temperature: 0.05

    # Logging & Evaluation
    wandb_run_name: "embeddinggemma-300m-optimized"
    logging_steps: 20
    eval_steps: 1000 
    save_steps: 1000
    output_dir: "./output/gemma"


  # =====================================================
  # 2 BAAI BGE-M3 
  # =====================================================
  bge_m3:
    enabled: false
    model_name: "BAAI/bge-m3"
    batch_size: 2              
    num_epochs: 30
    learning_rate: 0.00001
    max_seq_length: 384

    # LoRA
    use_lora: true
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.1

    # BGE-M3 specific settings
    use_dense: true
    use_sparse: false
    use_colbert: false

    # Training
    gradient_accumulation_steps: 2  # Tăng tốc training
    warmup_steps: 500
    weight_decay: 0.01

    # Logging & checkpoints
    logging_steps: 100
    eval_steps: 1000
    save_steps: 1000
    output_dir: "./output/bge_m3"


  # =====================================================
  # 3 MiniLM-L6-v2 
  # =====================================================
  minilm:
    enabled: true
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    batch_size: 32            
    num_epochs: 30
    learning_rate: 0.00002
    max_seq_length: 256
    embedding_dim: 384
    gradient_accumulation_steps: 4

    # Mixed precision
    use_fp16: true
    use_bf16: false

    # Data configuration
    negative_samples: 5

    # Training
    warmup_steps: 500
    weight_decay: 0.01
    save_steps: 1000
    eval_steps: 1000
    logging_steps: 100
    output_dir: "./output/minilm"

    # Contrastive learning
    temperature: 0.07

    # Wandb configuration
    wandb_run_name: "minilm-l6-v2-embedding-finetune"


# -------------------------------
# Cấu hình output
# -------------------------------
output:
  base_dir: "/home/nhotin/work/LegalBizAI_project/finetune/embedding_models"
  models_dir: "models"
  logs_dir: "logs"
  evaluation_dir: "evaluation"


# -------------------------------
# Target metrics để đánh giá mô hình
# -------------------------------
targets:
  recall_at_1: 0.35
  recall_at_5: 0.85
  recall_at_10: 0.90
  mrr_at_10: 0.80
  ndcg_at_10: 0.80
  context_precision: 0.85
