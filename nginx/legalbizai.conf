# LegalBizAI Configuration
# HTTP server block - redirect to HTTPS
server {
    listen 80;
    server_name legalbizai.hypersona.vn;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server block with Let's Encrypt certificate
server {
    listen 443 ssl;
    http2 on;
    server_name legalbizai.hypersona.vn;

    # Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/legalbizai.hypersona.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legalbizai.hypersona.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # SSL optimizations
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/legalbizai_access.log;
    error_log /var/log/nginx/legalbizai_error.log;

    # Frontend - serve static files from /LegalbizAi_chatbot path
    location /LegalbizAi_chatbot/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /LegalbizAi_chatbot/index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    location = /LegalbizAi_chatbot {
        return 301 /LegalbizAi_chatbot/;
    }

    # Root path redirect to /LegalbizAi_chatbot
    location = / {
        return 301 /LegalbizAi_chatbot;
    }

    # Backend API proxy
    # /api/stream -> http://host.docker.internal:8000/stream
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        # Use IP directly - host.docker.internal resolves to 172.17.0.1
        proxy_pass http://172.17.0.1:8000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /LegalbizAi_chatbot/404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

